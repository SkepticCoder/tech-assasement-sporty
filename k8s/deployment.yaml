apiVersion: apps/v1
kind: Deployment
metadata:
  name: bet-settlement-service
  namespace: default
  labels:
    app: bet-settlement-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bet-settlement-service
  template:
    metadata:
      labels:
        app: bet-settlement-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: bet-settlement-service
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image: bet-settlement-service:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: bet-settlement-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "4096Mi"
              cpu: "1000m"
      volumes:
        - name: tmp
          emptyDir: {}
