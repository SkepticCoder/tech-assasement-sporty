version: "3.8"

services:
  bet-settlement:
    build:
      context: .
      dockerfile: ./Dockerfile.native
      target: runtime-builder          # Build from source for local dev
    image: bet-settlement:latest
    ports:
      - "8080:8080"                     # Adjust to your app's port
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - ROCKETMQ_NAMESRV_ADDR=rocketmq-namesrv:9876
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy

  # Development service – only started with profile "dev"
  bet-settlement-dev:
    build:
      context: ./bet-settlement
      dockerfile: Dockerfile.debug
    image: bet-settlement:debug
    profiles:
      - dev                         # <-- only active when --profile dev is used
    ports:
      - "8080:8080"
      - "5005:5005"                 # JDWP port
    environment:
      - OTEL_SERVICE_NAME=bet-settlement
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    volumes:
      - ./coredumps:/tmp/coredumps
      - ./logs:/app/logs
      - ./jfr-recordings:/tmp
      # Mount source code for live reload (if your app supports it)
      - ./bet-settlement/src:/app/src
      - ./bet-settlement/build/libs:/app/build/libs   # optional, for recompiled classes
    ulimits:
      core: -1
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - default

  redis:
    image: redis:${REDIS_VERSION}
    ports:
      - "6377:6379"
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 6379" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  kafka:
    image: apache/kafka:${KAFKA_VERSION}
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9092" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8081:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  rocketmq-namesrv:
    image: apache/rocketmq:${ROCKETMQ_VERSION}
    container_name: rocketmq-namesrv
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    healthcheck:
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/localhost/9876'" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rocketmq-broker:
    image: apache/rocketmq:${ROCKETMQ_VERSION}
    container_name: rocketmq-broker
    ports:
      - "10911:10911"
      - "10909:10909"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    command: sh mqbroker -n rocketmq-namesrv:9876 --enable-proxy
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/10911'"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: rocketmq-dashboard
    ports:
      - "8082:8080"
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --enable-feature=otlp-write-receiver

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    ports:
      - "4317:4317"   # gRPC OTLP
      - "4318:4318"   # HTTP OTLP
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    depends_on:
      jaeger:
        condition: service_started
      prometheus:
        condition: service_started

  jaeger:
    image: jaegertracing/jaeger:2
    container_name: jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "4319:4317"   # gRPC OTLP (Jaeger native)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"