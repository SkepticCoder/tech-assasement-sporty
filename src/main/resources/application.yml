server:
  port: 8080

spring:
  application:
    name: bet-settlement-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: bet-settlement-group
    producer:
      transaction-id-prefix: bet-settlement-tx-

rocketmq:
  enabled: ${ROCKETMQ_ENABLED:true}
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: bet-settlement-producer-group

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
