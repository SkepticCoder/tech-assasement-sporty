server:
  port: 8080

spring:
  application:
    name: bet-settlement-service

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: bet-settlement-group
    producer:
      transaction-id-prefix: bet-settlement-tx-
    streams:
      application-id: bet-settlement-streams-app
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
      properties:
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        default.value.serde: org.springframework.kafka.support.serializer.JsonSerde
        spring.json.trusted.packages: '*'
      state-dir: /tmp/kafka-streams-state

# Settlement Strategy Configuration
# Supported strategies: REDIS (cache-based) or KAFKA_STREAMS (stream-based)
settlement:
  strategy: ${SETTLEMENT_STRATEGY}

# Dead-Letter Queue Configuration
dlq:
  enabled: ${DLQ_ENABLED}
  # Max retries before sending to DLQ
  max-retries: ${DLQ_MAX_RETRIES}
  # Monitoring
  monitoring:
    enabled: ${DLQ_MONITORING_ENABLED}
    alert-enabled: ${DLQ_ALERT_ENABLED}

rocketmq:
  enabled: ${ROCKETMQ_ENABLED}
  name-server: ${ROCKETMQ_NAME_SERVER}
  producer:
    group: bet-settlement-producer-group

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
