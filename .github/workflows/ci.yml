name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: eclipse-temurin:21-jdk-alpine

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./gradlew build -x test

  unit-tests:
    runs-on: ubuntu-latest
    container:
      image: eclipse-temurin:21-jdk-alpine
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: ./gradlew test --tests "com.sporty.betting.unit.*"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: build/reports/tests/

  integration-tests:
    runs-on: ubuntu-latest
    container:
      image: eclipse-temurin:21-jdk-alpine
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Run integration tests
        run: ./gradlew test --tests "com.sporty.betting.integration.*"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: build/reports/tests/

  acceptance-tests:
    runs-on: ubuntu-latest
    container:
      image: eclipse-temurin:21-jdk-alpine
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Run acceptance tests
        run: ./gradlew test --tests "com.sporty.betting.acceptance.*"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-test-results
          path: build/reports/tests/

  # ── Security Verification ──────────────────────────────────────────

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate dependency lockfile
        run: ./gradlew dependencies --write-locks || ./gradlew dependencies > /dev/null

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          scanners: vuln

      - name: Upload Trivy results
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-deps.sarif
          severity: CRITICAL,HIGH,MEDIUM
          scanners: vuln

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-deps.sarif
          category: dependency-scan

  secret-scan:
    name: Secret leak detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build for CodeQL
        run: ./gradlew build -x test

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: sast

  docker-image-scan:
    name: Docker image vulnerability scan
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, acceptance-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Docker image
        run: docker build -t bet-settlement-service:scan .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bet-settlement-service:scan
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          scanners: vuln

      - name: Upload Docker scan SARIF
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: bet-settlement-service:scan
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH,MEDIUM
          scanners: vuln

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: docker-image-scan

  # ── Release ───────────────────────────────────────────────────────

  native-image:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/graalvm/native-image-community:21-muslib
    needs:
      - unit-tests
      - integration-tests
      - acceptance-tests
      - dependency-scan
      - sast
      - docker-image-scan
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build native image
        run: ./gradlew nativeCompile

      - name: Upload native image
        uses: actions/upload-artifact@v4
        with:
          name: native-image
          path: build/native/nativeCompile/
