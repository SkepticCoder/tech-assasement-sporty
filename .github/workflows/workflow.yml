name: CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'                     # run on version tags, e.g., v1.2.3
  pull_request:
    branches: [ main ]
  workflow_dispatch:              # allows manual triggering from the UI
    inputs:
      version:
        description: 'Version to use (e.g., 1.2.3). If empty, auto-increment from latest tag.'
        required: false
        default: ''
      create_tag:
        description: 'Create a Git tag for this version?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  # Non-sensitive variables from GitHub Variables
  DB_URL: ${{ vars.DB_URL }}
  LOG_LEVEL: ${{ vars.LOG_LEVEL }}

jobs:
  # ---------- Build & Test ----------
  build:
    runs-on: ubuntu-latest
    container:
      image: eclipse-temurin:21-jdk-alpine

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version (for snapshot builds)
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ ${{ github.event_name }} == 'workflow_dispatch' && -n "${{ github.event.inputs.version }}" ]]; then
            VERSION=${{ github.event.inputs.version }}
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
            COMMIT_HASH=$(git rev-parse --short HEAD)
            VERSION="${LATEST_TAG}-${COMMIT_HASH}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version: $VERSION"

      - name: Build
        run: ./gradlew build -x test

  unit-tests:
    runs-on: ubuntu-latest
    container:
      image: eclipse-temurin:21-jdk-alpine
    needs: build

    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: ./gradlew test --tests "com.sporty.betting.unit.*"
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
          DB_URL: ${{ vars.DB_URL }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: build/reports/tests/

  integration-tests:
    runs-on: ubuntu-latest
    container:
      image: eclipse-temurin:21-jdk-alpine
    needs: build

    steps:
      - uses: actions/checkout@v4
      - name: Run integration tests
        run: ./gradlew test --tests "com.sporty.betting.integration.*"
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
          DB_URL: ${{ vars.DB_URL }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: build/reports/tests/

  acceptance-tests:
    runs-on: ubuntu-latest
    container:
      image: eclipse-temurin:21-jdk-alpine
    needs: build

    steps:
      - uses: actions/checkout@v4
      - name: Run acceptance tests
        run: ./gradlew test --tests "com.sporty.betting.acceptance.*"
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
          DB_URL: ${{ vars.DB_URL }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-test-results
          path: build/reports/tests/

  # ---------- Security Verification ----------
  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get version (for snapshot builds)
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ ${{ github.event_name }} == 'workflow_dispatch' && -n "${{ github.event.inputs.version }}" ]]; then
            VERSION=${{ github.event.inputs.version }}
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
            COMMIT_HASH=$(git rev-parse --short HEAD)
            VERSION="${LATEST_TAG}-${COMMIT_HASH}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Generate dependency lockfile
        run: ./gradlew dependencies --write-locks || ./gradlew dependencies > /dev/null
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
          DB_URL: ${{ vars.DB_URL }}
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          scanners: vuln
      - name: Upload Trivy results (SARIF)
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-deps.sarif
          severity: CRITICAL,HIGH,MEDIUM
          scanners: vuln
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-deps.sarif
          category: dependency-scan

  secret-scan:
    name: Secret leak detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get version (for snapshot builds)
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ ${{ github.event_name }} == 'workflow_dispatch' && -n "${{ github.event.inputs.version }}" ]]; then
            VERSION=${{ github.event.inputs.version }}
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
            COMMIT_HASH=$(git rev-parse --short HEAD)
            VERSION="${LATEST_TAG}-${COMMIT_HASH}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build for CodeQL
        run: ./gradlew build -x test
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
          DB_URL: ${{ vars.DB_URL }}
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: sast

  docker-image-scan:
    name: Docker image vulnerability scan
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, acceptance-tests]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ ${{ github.event_name }} == 'workflow_dispatch' && -n "${{ github.event.inputs.version }}" ]]; then
            VERSION=${{ github.event.inputs.version }}
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
            COMMIT_HASH=$(git rev-parse --short HEAD)
            VERSION="${LATEST_TAG}-${COMMIT_HASH}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build Docker image
        run: |
          docker build \
            --build-arg VERSION=$VERSION \
            -t bet-settlement-service:$VERSION \
            -t bet-settlement-service:scan \
            .
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
          DB_URL: ${{ vars.DB_URL }}
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bet-settlement-service:scan
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          scanners: vuln
      - name: Upload Docker scan SARIF
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: bet-settlement-service:scan
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH,MEDIUM
          scanners: vuln
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: docker-image-scan

  # ---------- Native Image ----------
  native-image:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/graalvm/native-image-community:21-muslib
    needs:
      - unit-tests
      - integration-tests
      - acceptance-tests
      - dependency-scan
      - sast
      - docker-image-scan
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ ${{ github.event_name }} == 'workflow_dispatch' && -n "${{ github.event.inputs.version }}" ]]; then
            VERSION=${{ github.event.inputs.version }}
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
            COMMIT_HASH=$(git rev-parse --short HEAD)
            VERSION="${LATEST_TAG}-${COMMIT_HASH}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Build native image with version
        run: ./gradlew nativeCompile -Pversion=$VERSION
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
          DB_URL: ${{ vars.DB_URL }}
      - name: Upload native image
        uses: actions/upload-artifact@v4
        with:
          name: native-image-${{ env.VERSION }}
          path: build/native/nativeCompile/

  # ---------- Auto Tag Creation (on push to main only) ----------
  create-tag:
    name: Create version tag after merge
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
      - acceptance-tests
      - dependency-scan
      - sast
      - docker-image-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine new version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LATEST_VERSION=${LATEST_TAG#v}
          IFS='.' read -r major minor patch <<< "$LATEST_VERSION"
          patch=$((patch + 1))
          NEW_VERSION="${major}.${minor}.${patch}"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT
      - name: Create and push tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created tag $TAG"
          fi

  # ---------- Manual Release Build (if triggered manually with create_tag=true) ----------
  manual-release:
    name: Manual release build
    runs-on: ubuntu-latest
    needs:
      - native-image
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_tag == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            LATEST_VERSION=${LATEST_TAG#v}
            IFS='.' read -r major minor patch <<< "$LATEST_VERSION"
            patch=$((patch + 1))
            VERSION="${major}.${minor}.${patch}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
      - name: Create and push tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created tag $TAG"
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            build/native/nativeCompile/*

  # ---------- Automatic Release on Tag Push ----------
  release-on-tag:
    name: Create GitHub Release from tag
    runs-on: ubuntu-latest
    needs:
      - native-image
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            build/native/nativeCompile/*