name: CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to use (e.g., 1.2.3). If empty, auto-increment from latest tag.'
        required: false
        default: ''
      create_tag:
        description: 'Create a Git tag for this version?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  DB_URL: ${{ vars.DB_URL }}
  LOG_LEVEL: ${{ vars.LOG_LEVEL }}
  CI: true

jobs:
  # ------------------------------------------------------------------
  # Determine build mode
  # ------------------------------------------------------------------
  config:
    name: Resolve build configuration
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.flags.outputs.native }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set build flags
        id: flags
        run: echo "native=${{ vars.NATIVE_IMAGE_ENABLED == 'true' }}" >> $GITHUB_OUTPUT
      - name: Determine version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ "${{ github.event_name }}" == 'workflow_dispatch' && -n "${{ github.event.inputs.version }}" ]]; then
            VERSION=${{ github.event.inputs.version }}
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
            COMMIT_HASH=$(git rev-parse --short HEAD)
            VERSION="${LATEST_TAG}-${COMMIT_HASH}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  # ------------------------------------------------------------------
  # Unit Tests
  # ------------------------------------------------------------------
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Run unit tests
        run: ./gradlew test --tests "com.sporty.betting.unit.*"
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: build/reports/tests/

  # ------------------------------------------------------------------
  # Integration Tests (Kafka, Redis & RocketMQ as service containers)
  # ------------------------------------------------------------------
  integration-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:29092,PLAINTEXT_HOST://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        options: >-
          --health-cmd "nc -z localhost 9092 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 30s
      rocketmq-namesrv:
        image: apache/rocketmq:5.3.1
        ports:
          - 9876:9876
        options: >-
          --health-cmd "nc -z localhost 9876 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 10s
      rocketmq-broker:
        image: apache/rocketmq:5.3.1
        ports:
          - 10911:10911
          - 10909:10909
        env:
          NAMESRV_ADDR: rocketmq-namesrv:9876
        options: >-
          --health-cmd "nc -z localhost 10911 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Run integration tests
        run: ./gradlew test --tests "com.sporty.betting.integration.*"
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: build/reports/tests/

  # ------------------------------------------------------------------
  # Acceptance Tests (Kafka, Redis & RocketMQ as service containers)
  # ------------------------------------------------------------------
  acceptance-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:29092,PLAINTEXT_HOST://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        options: >-
          --health-cmd "nc -z localhost 9092 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 30s
      rocketmq-namesrv:
        image: apache/rocketmq:5.3.1
        ports:
          - 9876:9876
        options: >-
          --health-cmd "nc -z localhost 9876 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 10s
      rocketmq-broker:
        image: apache/rocketmq:5.3.1
        ports:
          - 10911:10911
          - 10909:10909
        env:
          NAMESRV_ADDR: rocketmq-namesrv:9876
        options: >-
          --health-cmd "nc -z localhost 10911 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Run acceptance tests
        run: ./gradlew test --tests "com.sporty.betting.acceptance.*"
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-test-results
          path: build/reports/tests/

  # ------------------------------------------------------------------
  # Security scans
  # ------------------------------------------------------------------
  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Generate dependency lockfile
        run: ./gradlew dependencies --write-locks || ./gradlew dependencies > /dev/null
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          scanners: vuln
      - name: Upload Trivy results (SARIF)
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-deps.sarif
          severity: CRITICAL,HIGH,MEDIUM
          scanners: vuln
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-deps.sarif
          category: dependency-scan

  secret-scan:
    name: Secret leak detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build for CodeQL
        run: ./gradlew build -x test
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: sast

  # ------------------------------------------------------------------
  # Native compilation (using GraalVM) — only when NATIVE_IMAGE_ENABLED=true
  # ------------------------------------------------------------------
  native-compile:
    name: Compile native image
    runs-on: ubuntu-latest
    needs: [ config, unit-tests, integration-tests, acceptance-tests, dependency-scan, sast ]
    if: needs.config.outputs.native == 'true'
    container:
      image: ghcr.io/graalvm/native-image-community:21-muslib
    outputs:
      version: ${{ needs.config.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build native image
        run: ./gradlew nativeCompile -Pversion=${{ needs.config.outputs.version }}
      - name: Upload native binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-image-${{ needs.config.outputs.version }}
          path: build/native/nativeCompile/

  # ------------------------------------------------------------------
  # Docker build (native) – packages pre-compiled native binary
  # ------------------------------------------------------------------
  docker-build-native:
    name: Build Docker image (native)
    runs-on: ubuntu-latest
    needs: [ config, native-compile ]
    if: needs.config.outputs.native == 'true'
    outputs:
      version: ${{ needs.config.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Download native binary
        uses: actions/download-artifact@v4
        with:
          name: native-image-${{ needs.config.outputs.version }}
          path: ./native
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          build-args: |
            VERSION=${{ needs.config.outputs.version }}
          tags: |
            bet-settlement-service:${{ needs.config.outputs.version }}
            bet-settlement-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Save Docker image as artifact
        run: docker save bet-settlement-service:${{ needs.config.outputs.version }} | gzip > docker-image.tar.gz
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar.gz

  # ------------------------------------------------------------------
  # Docker build (JVM) – standard Dockerfile, no native binary needed
  # ------------------------------------------------------------------
  docker-build-jvm:
    name: Build Docker image (JVM)
    runs-on: ubuntu-latest
    needs: [ config, unit-tests, integration-tests, acceptance-tests, dependency-scan, sast ]
    if: needs.config.outputs.native != 'true'
    outputs:
      version: ${{ needs.config.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          build-args: |
            VERSION=${{ needs.config.outputs.version }}
          tags: |
            bet-settlement-service:${{ needs.config.outputs.version }}
            bet-settlement-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Save Docker image as artifact
        run: docker save bet-settlement-service:${{ needs.config.outputs.version }} | gzip > docker-image.tar.gz
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar.gz

  # ------------------------------------------------------------------
  # Docker image vulnerability scan (runs for both native and JVM)
  # ------------------------------------------------------------------
  docker-image-scan:
    name: Docker image vulnerability scan
    runs-on: ubuntu-latest
    needs: [ config, docker-build-native, docker-build-jvm ]
    if: |
      always() &&
      (needs.docker-build-native.result == 'success' || needs.docker-build-jvm.result == 'success') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp
      - name: Load Docker image
        run: docker load < /tmp/docker-image.tar.gz
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bet-settlement-service:latest
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          scanners: vuln
      - name: Upload Docker scan SARIF
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: bet-settlement-service:latest
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH,MEDIUM
          scanners: vuln
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: docker-image-scan

  # ------------------------------------------------------------------
  # Auto tag creation after merge to main
  # ------------------------------------------------------------------
  create-tag:
    name: Create version tag after merge
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
      - acceptance-tests
      - dependency-scan
      - sast
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine new version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LATEST_VERSION=${LATEST_TAG#v}
          IFS='.' read -r major minor patch <<< "$LATEST_VERSION"
          patch=$((patch + 1))
          NEW_VERSION="${major}.${minor}.${patch}"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT
      - name: Create and push tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created tag $TAG"
          fi

  # ------------------------------------------------------------------
  # Release – works for both native and JVM builds
  # ------------------------------------------------------------------
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [ config, docker-image-scan ]
    if: |
      always() &&
      (needs.docker-image-scan.result == 'success' || needs.docker-image-scan.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_tag == 'true'))
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            TAG=$GITHUB_REF_NAME
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION=${{ github.event.inputs.version }}
            TAG="v${VERSION}"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            LATEST_VERSION=${LATEST_TAG#v}
            IFS='.' read -r major minor patch <<< "$LATEST_VERSION"
            patch=$((patch + 1))
            VERSION="${major}.${minor}.${patch}"
            TAG="v${VERSION}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create and push tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created tag $TAG"
          fi

      - name: Download native image artifact
        if: needs.config.outputs.native == 'true'
        uses: actions/download-artifact@v4
        with:
          name: native-image-${{ needs.config.outputs.version }}
          path: ./release-assets

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: ./release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: ./release-assets/*
