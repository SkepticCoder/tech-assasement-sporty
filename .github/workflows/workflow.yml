name: CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to use (e.g., 1.2.3). If empty, auto-increment from latest tag.'
        required: false
        default: ''
      create_tag:
        description: 'Create a Git tag for this version?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  DB_URL: ${{ vars.DB_URL }}
  LOG_LEVEL: ${{ vars.LOG_LEVEL }}

jobs:
  # ------------------------------------------------------------------
  # Build the Docker image containing the compiled application
  # ------------------------------------------------------------------
  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ ${{ github.event_name }} == 'workflow_dispatch' && -n "${{ github.event.inputs.version }}" ]]; then
            VERSION=${{ github.event.inputs.version }}
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
            COMMIT_HASH=$(git rev-parse --short HEAD)
            VERSION="${LATEST_TAG}-${COMMIT_HASH}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            bet-settlement-service:${{ steps.version.outputs.version }}
            bet-settlement-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image as artifact
        run: docker save bet-settlement-service:${{ steps.version.outputs.version }} | gzip > docker-image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar.gz

  # ------------------------------------------------------------------
  # Run tests inside the Docker container (reports are extracted)
  # ------------------------------------------------------------------
  unit-tests:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/docker-image.tar.gz

      - name: Create reports directory
        run: mkdir -p test-reports/unit

      - name: Run unit tests
        run: |
          docker run --rm \
            -v $(pwd)/test-reports/unit:/app/build/reports/tests \
            -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            -e API_KEY=${{ secrets.API_KEY }} \
            -e DB_URL=${{ vars.DB_URL }} \
            -e LOG_LEVEL=${{ vars.LOG_LEVEL }} \
            bet-settlement-service:latest \
            ./gradlew test --tests "com.sporty.betting.unit.*"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-reports/unit

  integration-tests:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/docker-image.tar.gz

      - name: Create reports directory
        run: mkdir -p test-reports/integration

      - name: Run integration tests
        run: |
          docker run --rm \
            -v $(pwd)/test-reports/integration:/app/build/reports/tests \
            -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            -e API_KEY=${{ secrets.API_KEY }} \
            -e DB_URL=${{ vars.DB_URL }} \
            -e LOG_LEVEL=${{ vars.LOG_LEVEL }} \
            bet-settlement-service:latest \
            ./gradlew test --tests "com.sporty.betting.integration.*"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: test-reports/integration

  acceptance-tests:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/docker-image.tar.gz

      - name: Create reports directory
        run: mkdir -p test-reports/acceptance

      - name: Run acceptance tests
        run: |
          docker run --rm \
            -v $(pwd)/test-reports/acceptance:/app/build/reports/tests \
            -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            -e API_KEY=${{ secrets.API_KEY }} \
            -e DB_URL=${{ vars.DB_URL }} \
            -e LOG_LEVEL=${{ vars.LOG_LEVEL }} \
            bet-settlement-service:latest \
            ./gradlew test --tests "com.sporty.betting.acceptance.*"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-test-results
          path: test-reports/acceptance

  # ------------------------------------------------------------------
  # Security scans (dependency, secret, SAST)
  # ------------------------------------------------------------------
  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Generate dependency lockfile
        run: ./gradlew dependencies --write-locks || ./gradlew dependencies > /dev/null
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
          DB_URL: ${{ vars.DB_URL }}
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          scanners: vuln
      - name: Upload Trivy results (SARIF)
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-deps.sarif
          severity: CRITICAL,HIGH,MEDIUM
          scanners: vuln
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-deps.sarif
          category: dependency-scan

  secret-scan:
    name: Secret leak detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build for CodeQL
        run: ./gradlew build -x test
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
          DB_URL: ${{ vars.DB_URL }}
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: sast

  # ------------------------------------------------------------------
  # Docker image vulnerability scan
  # ------------------------------------------------------------------
  docker-image-scan:
    name: Docker image vulnerability scan
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, acceptance-tests]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp
      - name: Load Docker image
        run: docker load < /tmp/docker-image.tar.gz
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bet-settlement-service:latest
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          scanners: vuln
      - name: Upload Docker scan SARIF
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: bet-settlement-service:latest
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH,MEDIUM
          scanners: vuln
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: docker-image-scan

  # ------------------------------------------------------------------
  # Extract native image from the Docker image (if built)
  # ------------------------------------------------------------------
  extract-native:
    name: Extract native image from Docker image
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp
      - name: Load Docker image
        run: docker load < /tmp/docker-image.tar.gz
      - name: Extract native binary
        run: |
          docker create --name extract bet-settlement-service:latest
          docker cp extract:/app/build/native/nativeCompile ./native
          docker rm extract
      - name: Upload native image artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-image-${{ needs.docker-build.outputs.version }}
          path: ./native

  # ------------------------------------------------------------------
  # Auto tag creation after merge to main
  # ------------------------------------------------------------------
  create-tag:
    name: Create version tag after merge
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
      - acceptance-tests
      - dependency-scan
      - sast
      - docker-image-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine new version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LATEST_VERSION=${LATEST_TAG#v}
          IFS='.' read -r major minor patch <<< "$LATEST_VERSION"
          patch=$((patch + 1))
          NEW_VERSION="${major}.${minor}.${patch}"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT
      - name: Create and push tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created tag $TAG"
          fi

  # ------------------------------------------------------------------
  # Manual release (creates tag and GitHub release)
  # ------------------------------------------------------------------
  manual-release:
    name: Manual release build
    runs-on: ubuntu-latest
    needs:
      - extract-native
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_tag == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            LATEST_VERSION=${LATEST_TAG#v}
            IFS='.' read -r major minor patch <<< "$LATEST_VERSION"
            patch=$((patch + 1))
            VERSION="${major}.${minor}.${patch}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
      - name: Create and push tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created tag $TAG"
          fi
      - name: Download native image artifact
        uses: actions/download-artifact@v4
        with:
          name: native-image-${{ steps.version.outputs.version }}
          path: ./native
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            ./native/*

  # ------------------------------------------------------------------
  # Automatic release when a tag is pushed (e.g., from create-tag)
  # ------------------------------------------------------------------
  release-on-tag:
    name: Create GitHub Release from tag
    runs-on: ubuntu-latest
    needs:
      - extract-native
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download native image artifact
        uses: actions/download-artifact@v4
        with:
          name: native-image-${{ github.ref_name }}
          path: ./native
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            ./native/*