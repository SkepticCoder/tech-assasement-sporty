# ------------------------------------------------------------------
# Integration Tests
# ------------------------------------------------------------------
integration-tests:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
    - name: Pre‑pull Docker images for Testcontainers
      run: |
        # Pre‑pull commonly used images; adjust based on your actual containers
        docker pull confluentinc/cp-kafka:latest || true
        docker pull redis:latest || true
        docker pull apache/rocketmq:latest || true
    - name: Run integration tests with extended timeout
      run: ./gradlew test --tests "com.sporty.betting.integration.*" -Dorg.gradle.testkit.timeout=60000
      env:
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        API_KEY: ${{ secrets.API_KEY }}
        DB_URL: ${{ vars.DB_URL }}
        LOG_LEVEL: ${{ vars.LOG_LEVEL }}
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results
        path: build/reports/tests/

# ------------------------------------------------------------------
# Acceptance Tests
# ------------------------------------------------------------------
